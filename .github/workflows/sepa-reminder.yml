name: Recordatorio sync SEPA

# El sync de catalogo_sepa_ref (scripts/sync-catalogo-sepa.mjs) se corre a
# mano, no automatizado — ver CLAUDE.md para el detalle completo, pero en
# resumen: datos.produccion.gob.ar bloquea IPs de datacenter (403 real
# contra un runner hosteado de GitHub, confirmado, y también contra el
# sandbox de las rutinas programadas de Claude), y un self-hosted runner
# en la PC del usuario no es una opción segura en un repo público (forks
# podrían abrir un PR que ejecute código arbitrario en esa máquina —
# advertencia oficial de GitHub). Este workflow solo manda el recordatorio
# por mail; correr el script queda 100% manual.
on:
  schedule:
    - cron: '0 12 * * 1' # 12:00 UTC = 09:00 ART, todos los lunes
  workflow_dispatch: {}

jobs:
  recordatorio:
    runs-on: ubuntu-latest
    steps:
      - uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: gmenghi40@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: AlacenaApp — Sync SEPA <gmenghi40@gmail.com>
          to: gmenghi40@gmail.com
          subject: 'Recordatorio: correr el sync de SEPA'
          body: |
            Hoy corresponde correr a mano el sync semanal del catálogo
            SEPA/Precios Claros (productos de supermercados para el
            matching difuso).

            Pedile a Claude Code que lo corra, o ejecutá vos mismo:
            node scripts/sync-catalogo-sepa.mjs
            (con SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY en el entorno —
            nunca los pegues en un mail ni los commitees).
