name: Sync catálogo SEPA

# Corre como GitHub Actions y no como Edge Function de Supabase a
# propósito: el ZIP nacional del dataset pesa 300MB+ comprimidos y un solo
# comercio grande ya tiene millones de filas de producto — muy por encima
# de lo que una Edge Function (límite de ejecución ~150s, memoria acotada)
# puede procesar. Ver scripts/sync-catalogo-sepa.mjs para el detalle.
on:
  schedule:
    # 12:00 UTC = 09:00 ART, con margen después del horario límite de
    # envío de los comercios a SEPA (10:00 ART como máximo con rectificación).
    - cron: '0 12 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: node scripts/sync-catalogo-sepa.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
