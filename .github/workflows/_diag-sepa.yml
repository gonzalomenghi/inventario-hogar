name: _diag-sepa
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: curl verbose against SEPA URL
        run: |
          curl -v -o /tmp/body.html "https://datos.produccion.gob.ar/dataset/6f47ec76-d1ce-4e34-a7e1-621fe9b1d0b5/resource/0a9069a9-06e8-4f98-874d-da5578693290/download/sepa_lunes.zip" 2>&1 | tail -60
          echo "--- BODY (first 2KB) ---"
          head -c 2000 /tmp/body.html
          echo ""
          echo "--- runner egress IP ---"
          curl -s https://ifconfig.me || true
